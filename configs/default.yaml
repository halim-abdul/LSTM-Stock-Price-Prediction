data:
  ticker: AAPL
  start: "2015-01-01"
  end: null
  interval: "1d"
  date_column: Date
  target: Close
  features: [Close]
  train_ratio: 0.70
  val_ratio: 0.15

model:
  sequence_length: 60
  hidden_size: 64
  num_layers: 2
  dropout: 0.20

train:
  batch_size: 64
  epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10
  lr_patience: 4
  lr_factor: 0.5
  min_learning_rate: 0.000001
  gradient_clip_norm: 1.0
  seed: 42
  device: auto

forecast:
  horizon: 30

output:
  artifact_dir: artifacts
