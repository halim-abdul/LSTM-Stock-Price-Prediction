data:
  ticker: SYNTH
  start: "2015-01-01"
  end: null
  interval: "1d"
  date_column: Date
  target: Close
  features: [Close]
  train_ratio: 0.70
  val_ratio: 0.15

model:
  sequence_length: 30
  hidden_size: 32
  num_layers: 1
  dropout: 0.0

train:
  batch_size: 64
  epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 3
  lr_patience: 2
  lr_factor: 0.5
  min_learning_rate: 0.000001
  gradient_clip_norm: 1.0
  seed: 42
  device: cpu

forecast:
  horizon: 10

output:
  artifact_dir: artifacts
